# REQUIRES: powerpc
# RUN: yaml2obj %s -o %t.exe
# RUN: %lldb -b %t.exe -o "disassemble -s 0x82001000 -c 3" | FileCheck %s
# RUN: %lldb -b %t.exe -o "disassemble -s 0x82001000 -c 1 --cpu g5" | FileCheck %s --check-prefix=OVERRIDE
# RUN: %lldb -b %t.exe -o "settings set target.disassembly-cpu g5" -o "disassemble -s 0x82001000 -c 1" | FileCheck %s --check-prefix=OVERRIDE
# RUN: %lldb -b %t.exe -o "settings set target.disassembly-features +altivec" -o "disassemble -s 0x82001000 -c 1" | FileCheck %s --check-prefix=OVERRIDE
# RUN: %lldb -b %t.exe -o "settings set target.disassembly-cpu g5" -o "settings set target.disassembly-features +vmx128" -o "disassemble -s 0x82001000 -c 1" | FileCheck %s --check-prefix=VMX

# CHECK: [0x82001000]: lvx128
# CHECK-SAME: 127, 3, 4
# CHECK: [0x82001004]: vaddfp128
# CHECK-SAME: 127, 96, 64
# CHECK: [0x82001008]: ld
# CHECK-SAME: 3, 0(4)
# OVERRIDE: [0x82001000]: vinsw
# VMX: [0x82001000]: lvx128

--- !COFF
OptionalHeader:
  ImageBase: 0x82000000
  AddressOfEntryPoint: 4096
  SectionAlignment: 4096
  FileAlignment: 512
  Subsystem: IMAGE_SUBSYSTEM_XBOX
header:
  Machine: IMAGE_FILE_MACHINE_PPCBE
  Characteristics: [ IMAGE_FILE_EXECUTABLE_IMAGE ]
sections:
  - Name: .text
    VirtualAddress: 4096
    VirtualSize: 12
    Characteristics: [ IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ ]
    SectionData: '13E320CF17E0043EE8640000'
symbols: []
